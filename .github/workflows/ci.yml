name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Nightly regression run at 02:00 UTC
    - cron: "0 2 * * *"
  workflow_dispatch:

# A new push to the same branch cancels the previous run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  # Headless everywhere in CI.
  HEADED: "0"
  SLOW_MO: "0"

jobs:
  api-tests:
    name: API tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run API contract tests
        run: python -m pytest api -n auto --html=reports/api-report.html --self-contained-html

      - name: Upload API report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-report
          path: reports/
          if-no-files-found: ignore
          retention-days: 14

  ui-tests:
    name: UI tests (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Pull requests and pushes run chromium only; the nightly run widens
        # the matrix to catch engine-specific regressions.
        browser: ${{ github.event_name == 'schedule' && fromJSON('["chromium", "firefox"]') || fromJSON('["chromium"]') }}
    env:
      BROWSER: ${{ matrix.browser }}
      BASE_URL: https://www.saucedemo.com/
      # Demo credentials; override them with repository secrets if the target
      # environment ever stops being a public demo.
      SAUCE_USERNAME: ${{ secrets.SAUCE_USERNAME || 'standard_user' }}
      SAUCE_PASSWORD: ${{ secrets.SAUCE_PASSWORD || 'secret_sauce' }}
      TRACE: retain-on-failure
      VIDEO: retain-on-failure
      SCREENSHOT: retain-on-failure
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browser (${{ matrix.browser }})
        run: python -m playwright install --with-deps ${{ matrix.browser }}

      - name: Run UI suite in parallel
        run: python -m pytest tests -n auto --html=reports/report-${{ matrix.browser }}.html --self-contained-html

      - name: Upload HTML report and failure artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-artifacts-${{ matrix.browser }}
          path: |
            reports/
            traces/
            screenshots/
            videos/
          if-no-files-found: ignore
          retention-days: 14

  dashboard:
    name: Dashboard (GitHub Pages)
    # Builds the analytics dashboard from this run's results plus the history
    # already published on the gh-pages branch, then publishes both. Runs even
    # when tests failed: a red run is exactly what the dashboard is for.
    needs: [api-tests, ui-tests]
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: gh-pages-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Restore published history
        # The gh-pages branch is the store: site/history/*.json accumulates
        # one file per CI job across runs. First run: the branch does not
        # exist yet and this step is a no-op.
        run: |
          mkdir -p reports/history site
          if git fetch --depth=1 origin gh-pages 2>/dev/null; then
            git --work-tree=site checkout origin/gh-pages -- . 2>/dev/null || true
            cp site/history/*.json reports/history/ 2>/dev/null || true
          fi
          echo "restored $(ls reports/history | wc -l) history file(s)"

      - name: Download this run's results
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect result shards and the latest UI report
        run: |
          find artifacts -path '*/history/*.json' -exec cp {} reports/history/ \;
          echo "history now has $(ls reports/history | wc -l) file(s)"
          latest_report=$(find artifacts -name 'report-chromium.html' | head -n 1)
          if [ -n "$latest_report" ]; then cp "$latest_report" site/report.html; fi
          api_report=$(find artifacts -name 'api-report.html' | head -n 1)
          if [ -n "$api_report" ]; then cp "$api_report" site/api-report.html; fi

      - name: Build the dashboard
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python -m utils.dashboard \
            --history reports/history \
            --out site/index.html \
            --max-runs 200 \
            --link "UI report=report.html" \
            --link "API report=api-report.html"
          # keep the store bounded: newest 400 shard files (~200 runs of two jobs)
          mkdir -p site/history
          rm -f site/history/*.json
          ls -t reports/history/*.json | head -n 400 | xargs -I{} cp {} site/history/
          touch site/.nojekyll

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          force_orphan: true
          commit_message: "Publish dashboard for ${{ github.sha }}"
          user_name: "github-actions[bot]"
          user_email: "41898282+github-actions[bot]@users.noreply.github.com"
