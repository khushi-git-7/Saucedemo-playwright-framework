[pytest]
minversion = 8.0

# `api` holds the HTTP contract tests, `tests` the Playwright UI tests.
testpaths = tests api

# Makes the repo root importable (pages/, utils/, api/) without sys.path hacks
# in conftest.py, from any working directory.
pythonpath = .

addopts =
    -v
    -ra
    --strict-markers
    --strict-config
    --html=reports/report.html
    --self-contained-html

markers =
    smoke: fast confidence check - the critical path of each area
    regression: the full functional suite
    e2e: end-to-end journeys that cross several pages
    ui: browser tests driven through Playwright
    api: HTTP contract tests driven through requests

log_cli_level = INFO
log_format = %(asctime)s %(levelname)-8s %(name)s %(message)s
log_date_format = %H:%M:%S
